<!DOCTYPE html>
<!--
  Logistic growth explorer.
  Model implemented:  N(t+1) = N(t) + r * N(t) * (1 - N(t)/K)
  (discrete-time logistic map, Euler step of dN/dt = rN(1 - N/K) with dt = 1)

  This file is deliberately self-contained: no libraries, no build step.
  Open it directly in a browser to test it, then embed it with

      <iframe src="applets/example-applet.html" width="100%" height="620"></iframe>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logistic growth explorer</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f4f6f8; --ink:#1b2430; --muted:#5b6875;
    --line:#d8dee6; --accent:#1f7a6c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151a20; --panel:#1e252d; --ink:#e6ebf0; --muted:#9aa7b4;
      --line:#2c353f; --accent:#4fc0a6;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px;
    background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  h1{font-size:1.15rem; margin:0 0 4px}
  p.sub{margin:0 0 14px; color:var(--muted); font-size:.9rem}
  .wrap{display:flex; flex-direction:column; gap:14px; max-width:900px; margin:0 auto}
  .controls{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; display:grid; gap:12px;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
  }
  label{display:block; font-size:.82rem; color:var(--muted); margin-bottom:4px}
  label b{color:var(--ink); font-variant-numeric:tabular-nums}
  input[type=range]{width:100%; accent-color:var(--accent)}
  canvas{
    width:100%; height:auto; display:block;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
  }
  .readout{font-size:.85rem; color:var(--muted)}
  .readout b{color:var(--ink); font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Logistic growth explorer</h1>
    <p class="sub">N<sub>t+1</sub> = N<sub>t</sub> + r·N<sub>t</sub>·(1 − N<sub>t</sub>/K)</p>
  </div>

  <div class="controls">
    <div>
      <label>growth rate r = <b id="rOut">0.20</b></label>
      <input id="r" type="range" min="0.01" max="3.00" step="0.01" value="0.20">
    </div>
    <div>
      <label>carrying capacity K = <b id="kOut">100</b></label>
      <input id="k" type="range" min="10" max="400" step="10" value="100">
    </div>
    <div>
      <label>starting size N₀ = <b id="nOut">2</b></label>
      <input id="n" type="range" min="1" max="200" step="1" value="2">
    </div>
  </div>

  <canvas id="plot" width="900" height="380"></canvas>

  <p class="readout">
    After 60 steps: N = <b id="final">–</b> &nbsp;·&nbsp;
    behaviour: <b id="regime">–</b>
  </p>
</div>

<script>
(function(){
  var cv = document.getElementById('plot'), cx = cv.getContext('2d');
  var STEPS = 60;

  function series(r, K, N0){
    var out = [N0], N = N0;
    for (var i = 0; i < STEPS; i++){
      N = N + r * N * (1 - N / K);
      if (!isFinite(N) || N < 0) N = 0;      // keep the plot sane at extreme r
      out.push(N);
    }
    return out;
  }

  function regimeOf(s, K){
    var tail = s.slice(-12);
    var lo = Math.min.apply(null, tail), hi = Math.max.apply(null, tail);
    if (hi < 1e-6) return "extinction";
    if (hi - lo < 0.01 * K) return "settles at K";
    var rising = true;
    for (var i = 1; i < tail.length; i++) if (tail[i] < tail[i-1]) { rising = false; break; }
    if (rising) return "still growing";          // slow r: has not reached K yet
    if (hi - lo < 0.6 * K) return "oscillates";
    return "chaotic";
  }

  function draw(){
    var r = +document.getElementById('r').value,
        K = +document.getElementById('k').value,
        N0 = +document.getElementById('n').value;

    document.getElementById('rOut').textContent = r.toFixed(2);
    document.getElementById('kOut').textContent = K;
    document.getElementById('nOut').textContent = N0;

    var s = series(r, K, N0);
    var css = getComputedStyle(document.documentElement);
    var ink = css.getPropertyValue('--ink').trim(),
        muted = css.getPropertyValue('--muted').trim(),
        line = css.getPropertyValue('--line').trim(),
        accent = css.getPropertyValue('--accent').trim();

    var W = cv.width, H = cv.height, pad = 44;
    var yMax = Math.max(K * 1.6, Math.max.apply(null, s) * 1.05, 1);
    var X = function(i){ return pad + i / STEPS * (W - pad - 16); };
    var Y = function(v){ return H - pad - (v / yMax) * (H - pad - 16); };

    cx.clearRect(0, 0, W, H);

    // carrying capacity
    cx.strokeStyle = muted; cx.setLineDash([5, 5]); cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(pad, Y(K)); cx.lineTo(W - 16, Y(K)); cx.stroke();
    cx.setLineDash([]);
    cx.fillStyle = muted; cx.font = '13px system-ui';
    cx.fillText('K', W - 30, Y(K) - 6);

    // axes
    cx.strokeStyle = line; cx.lineWidth = 1.5;
    cx.beginPath();
    cx.moveTo(pad, 16); cx.lineTo(pad, H - pad); cx.lineTo(W - 16, H - pad);
    cx.stroke();
    cx.fillStyle = muted;
    cx.fillText('time', W / 2 - 14, H - 14);
    cx.fillText('N', pad - 10, 12);
    cx.fillText('0', pad - 16, H - pad + 4);
    cx.fillText(String(Math.round(yMax)), pad - 34, 26);

    // the trajectory
    cx.strokeStyle = accent; cx.lineWidth = 2.5; cx.beginPath();
    for (var i = 0; i < s.length; i++){
      if (i === 0) cx.moveTo(X(i), Y(s[i])); else cx.lineTo(X(i), Y(s[i]));
    }
    cx.stroke();

    cx.fillStyle = accent;
    for (var j = 0; j < s.length; j++){
      cx.beginPath(); cx.arc(X(j), Y(s[j]), 2.2, 0, 6.284); cx.fill();
    }

    document.getElementById('final').textContent = s[s.length - 1].toFixed(1);
    document.getElementById('regime').textContent = regimeOf(s, K);
  }

  ['r','k','n'].forEach(function(id){
    document.getElementById(id).addEventListener('input', draw);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', draw);
  }
  draw();
})();
</script>
</body>
</html>
